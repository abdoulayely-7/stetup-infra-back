name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/todo-back:latest .

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/todo-back:latest

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/aws-ec2-key

          chmod 600 ~/.ssh/aws-ec2-key

          cat > ~/.ssh/config <<EOF
          Host front
              HostName ${{ secrets.FRONT_HOST }}
              User ubuntu
              IdentityFile ~/.ssh/aws-ec2-key
              StrictHostKeyChecking no

          Host back
              HostName ${{ secrets.BACK_HOST }}
              User ubuntu
              IdentityFile ~/.ssh/aws-ec2-key
              ProxyJump front
              StrictHostKeyChecking no
          EOF

      - name: Copy docker-compose
        run: |

          scp docker-compose.yml \
          back:/opt/todo/back/

      - name: Deploy
        run: |

          ssh back <<EOF

          cd /opt/todo/back

          docker compose pull

          docker compose down || true

          docker compose up -d --remove-orphans

          EOF
